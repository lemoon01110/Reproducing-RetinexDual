name: checks

# The substantive claims in this repository need a 4K-capable GPU and a
# licence-restricted dataset, so CI cannot verify them. What it can do is stop
# the report from rotting: broken scripts, dead links, numbers that disagree
# between the prose and the committed CSVs, and the writing conventions.
#
# Anything CI cannot check is stated as such in README section 7 rather than
# implied to be covered here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install what the checks need
        # See requirements-ci.txt. CPU-only, and deliberately not the environment
        # that runs the model, which setup_env.sh builds.
        run: pip install --quiet -r requirements-ci.txt

      - name: Scripts compile
        run: python -m compileall -q scripts/

      - name: Shell scripts parse
        run: |
          for f in setup_env.sh reproduce.sh; do
            bash -n "$f" && echo "ok   $f"
          done

      - name: Every argparse script shows help without a GPU
        # Catches the class of error where a flag is added to the parser but not
        # threaded through, which shipped once in this repository already.
        run: |
          for f in scripts/*.py; do
            grep -q argparse "$f" || continue
            python "$f" --help > /dev/null 2>&1 \
              && echo "ok   $f --help" \
              || { echo "FAIL $f --help"; exit 1; }
          done

      - name: Internal links resolve
        run: python scripts/check_report.py --links

      - name: Prose numbers match the committed CSVs
        run: python scripts/check_report.py --numbers

      - name: Measured tables match their artifacts
        # Determinism, footprint and SSIM. These went stale repeatedly during
        # writing, because unlike the reproduction they had no committed source
        # of truth. Covers ENVIRONMENT.md as well as README.md, since the two
        # restate the same figures and drifted apart independently.
        run: python scripts/check_report.py --tables

      - name: Memory scaling law still holds
        # README section 5 leans on peak allocation being linear in pixel count.
        # Refit the line from the artifacts so a torch release that changes
        # allocation behaviour cannot quietly falsify the claim.
        run: python scripts/check_report.py --scaling

      - name: Report's claims still describe the pinned commit
        # Fetches the real upstream files and re-tests each claimed defect.
        # Blocking: the report describes a specific commit and must describe it
        # accurately, so a failure here is a factual error in this repository.
        run: python scripts/verify_defects.py --pinned

      - name: Has upstream fixed anything since
        # Informational. A failure means upstream moved, which is not a bug here,
        # but the report should then note which defects were later fixed rather
        # than keep asserting them against a repository that no longer has them.
        continue-on-error: true
        run: python scripts/verify_defects.py --head

      - name: Metric implementations agree with their references
        # SSIM_GAP.md's clustering argument is only as good as the code behind
        # it. Pins ssim_matlab against scikit-image with a matched kernel, and
        # the colour transforms against the BT.601 definition.
        run: python scripts/test_metrics.py

      - name: Aggregation cannot explain the SSIM gap
        # Reads the committed per-image CSV, no GPU. Fails if some aggregation
        # reproduces BOTH published numbers, which would mean the gap is
        # explained and SSIM_GAP.md needs rewriting rather than defending.
        run: python scripts/test_aggregation.py

      - name: Corrections list stays in sync
        # Section 7 lists what this report got wrong on the way. Cheap guard
        # that the list is not silently trimmed.
        run: |
          n=$(grep -c '^  - ' README.md || true)
          echo "corrections and scope bullets: $n"

      - name: Writing conventions
        # No em dashes, en dashes or semicolons in prose. A deliberate house
        # style for this repository, easy to reintroduce by accident.
        run: python scripts/check_report.py --style

      - name: Figure regenerates, and the committed one matches the committed data
        # Rendering to a temp file only proves the script runs. The check that
        # matters is figure_data.json against the CSVs, which is in --tables
        # above and catches a committed PNG left stale after the data changed.
        run: |
          python scripts/make_figure.py --results results --out /tmp/fig.png
          test -s /tmp/fig.png && echo "ok   figure renders"
